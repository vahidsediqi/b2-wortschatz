<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>B2 Wortschatz</title>
  <meta name="description" content="B2 German vocabulary flashcards with English and Farsi.">
  <meta name="theme-color" content="#10243B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="B2 Wortschatz">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2310243B'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='15' text-anchor='middle' fill='%23F2B84B'%3EB2%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=Vazirmatn:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="listView">
    <header class="top">
      <div class="top-inner">
        <h1>B2 Wortschatz</h1>
        <nav class="tabs" id="tabs" aria-label="Wortarten"></nav>
      </div>
    </header>
    <main class="wrap">
      <div class="tools">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Wort suchen" aria-label="Wort suchen" autocomplete="off" autocapitalize="off" spellcheck="false">
        </label>
        <div class="chips" id="chips" role="group" aria-label="Markierungen"></div>
      </div>
      <p class="count" id="count"></p>
      <ul class="list" id="list"></ul>
    </main>
  </section>

  <section id="cardView" hidden>
    <div class="card-page">
      <div class="bar">
        <button class="icon-btn" id="back" aria-label="Zurück zur Liste">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
        </button>
        <span class="bar-title" id="barTitle"></span>
        <span class="bar-pos" id="barPos"></span>
      </div>

      <div class="scene" id="scene">
        <div class="card" id="card" role="button" tabindex="0" aria-label="Karte umdrehen">
          <div class="face front" id="front"></div>
          <div class="face back" id="backFace"></div>
        </div>
      </div>

      <p class="hint" id="hint">Tippen zum Umdrehen</p>

      <div class="marks" id="marks" role="group" aria-label="Wort markieren"></div>

      <div class="controls">
        <button class="icon-btn" id="prev" aria-label="Vorheriges Wort">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>
        </button>
        <button class="icon-btn" id="speak" aria-label="Wort anhören">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.500 9.500z"/><path d="M15.500 9a4 4 0 0 1 0 6m2.500-8.500a7.500 7.500 0 0 1 0 11"/></svg>
        </button>
        <button class="icon-btn" id="next" aria-label="Nächstes Wort">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </section>

  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
